[project]
name = "proyecto-ciencia-datos-2026-2"
version = "0.1.0"
description = "Materiales del curso Proyecto en Ciencia de Datos, Otono 2026"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1",
    "ipykernel>=6.29,<7",
    "jupyter>=1.1.1",
    "jupyterlab>=4.2,<5",
    "nbclient>=0.10,<1",
    "nbformat>=5.10,<6",
    "pandas>=2.2,<3",
    "pyarrow>=25.0.1",
    "ruff>=0.6,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
