<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Recorrido de una solicitud HTTP en la aplicación FastAPI local</title>
  <desc id="desc">Un navegador o curl envía una solicitud GET a Uvicorn. FastAPI elige el endpoint, ejecuta una función Python y regresa una respuesta HTTP con código 200 y un cuerpo JSON.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 29px system-ui, sans-serif; fill: #172554; }
      .label { font: 700 19px system-ui, sans-serif; fill: #0f172a; }
      .text { font: 15px system-ui, sans-serif; fill: #334155; }
      .mono { font: 14px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #0f172a; }
    </style>
  </defs>
  <rect width="1200" height="500" rx="24" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" class="title">De una URL a una respuesta JSON</text>

  <rect x="45" y="145" width="200" height="150" rx="18" fill="#ecfeff" stroke="#0e7490" stroke-width="3"/>
  <text x="145" y="185" text-anchor="middle" class="label">Cliente</text>
  <text x="145" y="217" text-anchor="middle" class="text">navegador o curl</text>
  <text x="145" y="252" text-anchor="middle" class="mono">GET /viajes/42</text>

  <path d="M245 190 L365 190" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="305" y="168" text-anchor="middle" class="text">request HTTP</text>

  <rect x="370" y="120" width="200" height="200" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <text x="470" y="165" text-anchor="middle" class="label">Uvicorn</text>
  <text x="470" y="197" text-anchor="middle" class="text">servidor local</text>
  <text x="470" y="230" text-anchor="middle" class="mono">127.0.0.1:8000</text>
  <text x="470" y="270" text-anchor="middle" class="text">recibe y entrega</text>
  <text x="470" y="294" text-anchor="middle" class="text">la conversación</text>

  <path d="M570 220 L680 220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="625" y="198" text-anchor="middle" class="text">aplicación ASGI</text>

  <rect x="685" y="105" width="220" height="230" rx="18" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
  <text x="795" y="150" text-anchor="middle" class="label">FastAPI</text>
  <text x="795" y="182" text-anchor="middle" class="text">compara método + path</text>
  <rect x="715" y="215" width="160" height="75" rx="12" fill="#ffffff" stroke="#15803d"/>
  <text x="795" y="245" text-anchor="middle" class="mono">@app.get(...)</text>
  <text x="795" y="272" text-anchor="middle" class="text">elige el endpoint</text>

  <path d="M905 220 L1000 220" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1005" y="145" width="150" height="150" rx="18" fill="#fefce8" stroke="#a16207" stroke-width="3"/>
  <text x="1080" y="185" text-anchor="middle" class="label">Función</text>
  <text x="1080" y="217" text-anchor="middle" class="text">Python</text>
  <text x="1080" y="252" text-anchor="middle" class="mono">return {...}</text>

  <path d="M1080 295 L1080 395 L145 395 L145 295" fill="none" stroke="#7c3aed" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="610" y="380" text-anchor="middle" class="label">response HTTP: 200 OK + cuerpo JSON</text>
  <text x="610" y="430" text-anchor="middle" class="mono">{"viaje_id": 42, "pasajeros": 2}</text>
</svg>
