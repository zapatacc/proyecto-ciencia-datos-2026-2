<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Cinco niveles de madurez MLOps</title>
<desc id="desc">Una escalera avanza del nivel cero, proceso manual, al nivel cuatro, operación automatizada y observada. Cada peldaño añade una capacidad verificable.</desc>
<defs><style>text{font-family:Arial,sans-serif;fill:#172554}.title{font-size:28px;font-weight:700}.level{font-size:22px;font-weight:700}.body{font-size:16px;fill:#334155}</style></defs>
<rect width="1200" height="520" rx="20" fill="#f8fafc"/>
<text x="35" y="48" class="title">Madurez MLOps: avanzar por capacidades</text>
<rect x="45" y="365" width="210" height="105" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="65" y="398" class="level">0 · Manual</text><text x="65" y="429" class="body">Cada paso depende</text><text x="65" y="453" class="body">de una persona</text>
<rect x="270" y="300" width="210" height="170" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
<text x="290" y="333" class="level">1 · DevOps</text><text x="290" y="364" class="body">Código probado y</text><text x="290" y="388" class="body">aplicación desplegable;</text><text x="290" y="412" class="body">modelo aún manual</text>
<rect x="495" y="235" width="210" height="235" rx="12" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
<text x="515" y="268" class="level">2 · Entrenar</text><text x="515" y="299" class="body">Pipeline repetible,</text><text x="515" y="323" class="body">ejecuciones trazables</text><text x="515" y="347" class="body">y modelos gestionados</text>
<rect x="720" y="170" width="210" height="300" rx="12" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
<text x="740" y="203" class="level">3 · Desplegar</text><text x="740" y="234" class="body">Pruebas y promoción</text><text x="740" y="258" class="body">automáticas con</text><text x="740" y="282" class="body">trazabilidad completa</text>
<rect x="945" y="105" width="210" height="365" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
<text x="965" y="138" class="level">4 · Operar</text><text x="965" y="169" class="body">Monitoreo alimenta</text><text x="965" y="193" class="body">decisiones y activa</text><text x="965" y="217" class="body">procesos controlados</text>
<text x="45" y="500" class="body">La meta no es automatizar todo: es agregar la siguiente capacidad que reduce un riesgo real.</text>
</svg>
