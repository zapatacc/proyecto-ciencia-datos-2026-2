<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de una predicción desde Streamlit hasta el modelo registrado</title>
  <desc id="desc">Cuatro bloques conectados de izquierda a derecha: persona, Streamlit, FastAPI y MLflow Model champion. Las flechas superiores muestran la solicitud y las inferiores el regreso de la predicción.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="300" fill="#ffffff"/>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="35" y="80" width="190" height="100" rx="12" fill="#f8fafc" stroke="#334155" stroke-width="3"/>
    <text x="130" y="138" font-size="28" fill="#0f172a">Persona</text>

    <rect x="335" y="80" width="190" height="100" rx="12" fill="#e0f2fe" stroke="#0369a1" stroke-width="3"/>
    <text x="430" y="125" font-size="28" fill="#0c4a6e">Streamlit</text>
    <text x="430" y="155" font-size="18" fill="#0c4a6e">interfaz</text>

    <rect x="635" y="80" width="190" height="100" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="3"/>
    <text x="730" y="125" font-size="28" fill="#14532d">FastAPI</text>
    <text x="730" y="155" font-size="18" fill="#14532d">API propia</text>

    <rect x="935" y="80" width="230" height="100" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="3"/>
    <text x="1050" y="120" font-size="26" fill="#78350f">MLflow Model</text>
    <text x="1050" y="153" font-size="18" fill="#78350f">@champion</text>

    <path d="M225 105 H325" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M525 105 H625" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M825 105 H925" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="580" y="38" font-size="20" fill="#334155">datos del viaje → JSON → DataFrame</text>

    <path d="M935 165 H835" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M635 165 H535" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M335 165 H235" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="580" y="242" font-size="20" fill="#334155">duración, alias y versión ← respuesta JSON</text>
  </g>
</svg>
