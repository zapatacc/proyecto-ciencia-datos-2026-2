<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc">
<title id="title">Del host a la API en contenedor</title><desc id="desc">El navegador accede al puerto 8000 del host, publicado hacia el puerto 8000 del contenedor donde escucha Uvicorn.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#334155"/></marker></defs>
<rect width="1000" height="300" fill="#fff"/>
<g font-family="Arial, sans-serif" fill="#172033">
<rect x="20" y="95" width="220" height="110" rx="12" fill="#eef5fb" stroke="#334155" stroke-width="2"/>
<text x="130.0" y="135" font-size="21" text-anchor="middle">Cliente en el host</text>
<text x="130.0" y="167" font-size="17" text-anchor="middle">navegador / Postman</text>
<rect x="360" y="95" width="250" height="110" rx="12" fill="#eef5fb" stroke="#334155" stroke-width="2"/>
<text x="485.0" y="135" font-size="21" text-anchor="middle">Puerto del host</text>
<text x="485.0" y="167" font-size="17" text-anchor="middle">127.0.0.1:8000</text>
<rect x="730" y="95" width="250" height="110" rx="12" fill="#eef5fb" stroke="#334155" stroke-width="2"/>
<text x="855.0" y="135" font-size="21" text-anchor="middle">API en contenedor</text>
<text x="855.0" y="167" font-size="17" text-anchor="middle">Uvicorn 0.0.0.0:8000</text>
<path d="M240,150 L360,150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="300.0" y="138" font-size="16" text-anchor="middle">HTTP</text>
<path d="M610,150 L730,150" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="670.0" y="138" font-size="16" text-anchor="middle">publicación</text>
</g></svg>
