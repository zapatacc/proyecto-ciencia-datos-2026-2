<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="440" viewBox="0 0 1100 440" role="img" aria-labelledby="title desc"><title id="title">Reutilización del caché al cambiar código o requisitos</title><desc id="desc">En la primera construcción se ejecutan los tres pasos. Si sólo cambia api.py, se reutilizan la copia de requisitos y la instalación. Si cambia requirements.txt, se repiten los tres pasos. Se supone la misma imagen base y caché disponible.</desc><rect width="1100" height="440" fill="white"/><g font-family="Arial, sans-serif"><text x="550" y="35" font-size="26" fill="#172033" text-anchor="middle" font-weight="bold">¿Qué se repite al reconstruir?</text><text x="140" y="85" font-size="21" fill="#172033" text-anchor="middle" font-weight="bold">Cambio</text><text x="410" y="85" font-size="21" fill="#172033" text-anchor="middle" font-weight="bold">COPY requisitos</text><text x="670" y="85" font-size="21" fill="#172033" text-anchor="middle" font-weight="bold">RUN instalar</text><text x="930" y="85" font-size="21" fill="#172033" text-anchor="middle" font-weight="bold">COPY código</text><text x="140" y="153" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Primera construcción</text><rect x="295" y="112" width="230" height="68" rx="10" fill="#fff1dc" stroke="#a76a15" stroke-width="2"/><text x="410.0" y="153.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Ejecutar</text><rect x="555" y="112" width="230" height="68" rx="10" fill="#fff1dc" stroke="#a76a15" stroke-width="2"/><text x="670.0" y="153.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Ejecutar</text><rect x="815" y="112" width="230" height="68" rx="10" fill="#fff1dc" stroke="#a76a15" stroke-width="2"/><text x="930.0" y="153.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Ejecutar</text><text x="140" y="246" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Sólo api.py</text><rect x="295" y="205" width="230" height="68" rx="10" fill="#e7f3ed" stroke="#34755c" stroke-width="2"/><text x="410.0" y="246.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Reutilizar</text><rect x="555" y="205" width="230" height="68" rx="10" fill="#e7f3ed" stroke="#34755c" stroke-width="2"/><text x="670.0" y="246.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Reutilizar</text><rect x="815" y="205" width="230" height="68" rx="10" fill="#fff1dc" stroke="#a76a15" stroke-width="2"/><text x="930.0" y="246.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Ejecutar</text><text x="140" y="339" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">requirements.txt</text><rect x="295" y="298" width="230" height="68" rx="10" fill="#fff1dc" stroke="#a76a15" stroke-width="2"/><text x="410.0" y="339.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Ejecutar</text><rect x="555" y="298" width="230" height="68" rx="10" fill="#fff1dc" stroke="#a76a15" stroke-width="2"/><text x="670.0" y="339.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Ejecutar</text><rect x="815" y="298" width="230" height="68" rx="10" fill="#fff1dc" stroke="#a76a15" stroke-width="2"/><text x="930.0" y="339.0" font-size="20" fill="#172033" text-anchor="middle" font-weight="normal">Ejecutar</text><text x="550" y="411" font-size="18" fill="#172033" text-anchor="middle" font-weight="normal">Reutilizar = resultado disponible en caché · Ejecutar = construir ese paso otra vez</text></g></svg>
